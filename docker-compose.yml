services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
      POSTGRES_DB: sports
    ports: ["5432:5432"]
    volumes: [sports_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sports_pg:
