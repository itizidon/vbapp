services:
  postgres:
    image: vbapp-postgres-vector:17
    build:
      context: ./docker/postgres
      args:
        POSTGRES_BASE: postgres@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
      POSTGRES_DB: sports
    ports: ["5432:5432"]
    volumes: [sports_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sports_pg:
